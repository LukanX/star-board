[build]
  command = "npm run build -- --webpack && node -e \"require('fs').rmSync('.next-deploy', { recursive: true, force: true }); require('fs').cpSync('.next', '.next-deploy', { recursive: true })\""
  publish = ".next-deploy"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
